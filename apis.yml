aid: qualtera
name: Qualtera
description: 'Qualtera was a French software company, founded in 2010 and backed by Serena, that
  built high-volume big data analytics platforms for semiconductor test and manufacturing — giving
  IDMs, foundries and OSATs real-time observability, traceability and production control over test
  and assembly data across worldwide operations, processing the data of tens of millions of wafers
  and billions of parts a year. Its products included SiliconDash, an automated decision-support
  system for test, quality and yield analysis. Synopsys acquired Qualtera on June 10, 2020 and
  folded its analytics into Yield Explorer and TestMAX, which now ship as part of the Synopsys
  Silicon Lifecycle Management family. The Qualtera brand and any surface it once had are gone:
  qualtera.com now resolves to Synopsys nameservers and 301-redirects every path to the Synopsys
  Silicon Lifecycle Management marketing page, and the host refuses a TLS handshake on port 443
  entirely. Qualtera never published a public developer portal, API reference, OpenAPI definition,
  SDK or package on any registry, and no machine-readable contract survives under its own name.
  This profile is retained as a historical record; the live analytics API surface, where one exists,
  belongs to Synopsys and is profiled there rather than credited here.'
